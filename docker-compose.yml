services:
  postgres:
    image: postgres:16-alpine
    container_name: ayakapj-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ayakapj}
    ports:
      - "30000:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-ayakapj}"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  ayakapj:
    build: .
    container_name: ayakapj
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
  
volumes:
  postgres_data:

networks:
  default:
    enable_ipv6: true
